# One-command start:   docker compose up -d --build
# Load data first:     docker compose run --rm tools python -m scripts.generate_data --orders 1000000 --tenants 10 --reset
x-env: &env
  DATABASE_URL: postgresql://pulse:pulse@db:5432/pulse
  ADMIN_KEY: ${ADMIN_KEY:-change-me-admin-key}
  KEYS_FILE: /app/data/api_keys.json

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    command: >
      postgres -c shared_buffers=1GB -c effective_cache_size=3GB -c work_mem=32MB
      -c max_wal_size=4GB -c checkpoint_timeout=15min
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build: .
    command: python -m pulse.worker
    environment: *env
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./data:/app/data"]
    restart: unless-stopped

  api:
    build: .
    command: uvicorn pulse.api:app --host 0.0.0.0 --port 8000
    environment: *env
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    restart: unless-stopped

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      <<: *env
      API_URL: http://api:8000
    depends_on: [api]
    ports: ["8501:8501"]
    volumes: ["./data:/app/data"]
    restart: unless-stopped

  # Utility container for scripts (data generation, checks, benchmarks):
  #   docker compose run --rm tools python -m scripts.check_correctness --sample 5
  tools:
    build: .
    profiles: ["tools"]
    environment:
      <<: *env
      API_URL: http://api:8000
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./data:/app/data", "./benchmarks:/app/benchmarks"]

volumes:
  pgdata:
